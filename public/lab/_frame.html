<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;height:100%;overflow:hidden}iframe{width:640px;height:360px;border:0}</style>
<iframe id="f"></iframe>
<script>
// Temporary check page (not part of the site): one stage at a given step.
const q = new URLSearchParams(location.search), f = document.getElementById('f');
addEventListener('message', (e) => {
  if (e.data && e.data.type === 'lab-ready') {
    f.contentWindow.postMessage({ type: 'visible', visible: true }, location.origin);
    f.contentWindow.postMessage({ type: 'scene', scene: q.get('scene'), params: {}, manual: true, step: Number(q.get('step') || 1) }, location.origin);
  }
});
f.src = 'lab.html?ch=' + q.get('ch') + '&stage=1';
</script>
