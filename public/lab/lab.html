<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>互動實驗室</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">

<header class="lab-top">
  <a class="lab-back" href="/">← 回備考中心</a>
  <div>
    <div class="lab-kicker" id="kicker"></div>
    <h1 id="title">載入中…</h1>

<main class="lab-main">
  <section class="lab-stage" id="stage">
    <div class="lab-canvas" id="canvas">
      <div class="lab-caption" id="caption"></div>
      <div class="lab-formula-ov" id="formulaOv"></div>
    </div>
    <div class="lab-controls" id="controls"></div>
  </section>
  <aside class="lab-side">
    <div class="lab-card" id="stateCard"></div>
    <div class="lab-card">
      <div class="lab-card-hd">每一步發生什麼</div>
      <ol class="lab-log" id="log"></ol>
    </div>
  </aside>
  <section class="lab-page" id="page" hidden></section>
</main>

<script type="importmap">
{ "imports": {
