<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資工所備考中心 · 116學年度</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=20261007e">
<link rel="stylesheet" href="styles.css?v=20261008q">
</head>
<body id="appRoot">

<a class="skip-link" href="#main">跳到主要內容</a>

<main id="main" tabindex="-1">
  <!-- 右上角懸浮的直排按鈕組：日曆、六科、搜尋（沒有頁首） -->
  <nav class="fab-nav" id="pillnav" aria-label="主要功能">
    <button class="pill fab-btn on" type="button" data-sec="schedule" aria-current="page" onclick="goSec('schedule',this)" aria-label="日曆" title="日曆"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></button>
    <button class="pill fab-btn" type="button" data-sec="subjects" onclick="goSec('subjects',this)" aria-label="六科" title="六科"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></button>
    <button class="fab-btn global-search-toggle" type="button" onclick="openGlobalSearch()" aria-label="搜尋章節與資源" title="搜尋（Ctrl+K）"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
  </nav>

  <!-- ══════════ 日曆 ══════════ -->
  <div class="sec on" id="sec-schedule" aria-hidden="false">
    <section class="restart-card" id="restartCard" aria-label="重啟模式" hidden></section>

    <div class="sh">備考日曆</div>
    <div class="cal-header-card">
      <div class="cal-greet" id="greetingLine"></div>
      <div class="daily-focus" id="dailyFocus"></div>
      <div id="calPaceWarning"></div>
      <div class="cal-next-info" id="calNextInfo"></div>
    </div>

    <div class="smart-overview" id="smartOverview"></div>

    <div id="calContainer"></div>
  </div>

  <!-- ══════════ 六科章節計畫 ══════════ -->
  <div class="sec" id="sec-subjects" aria-hidden="true">
    <div class="sh">六科章節詳細計畫</div>
    <div class="ss">依章節查看考點、任務與完成進度。</div>
    <div class="stabs" id="stabs" role="tablist" aria-label="六科切換"></div>
    <div id="spPanels"></div>
  </div>

  <!-- ══════════ 備考素材 ══════════ -->
  <div class="sec" id="sec-materials" aria-hidden="true">
    <div class="sh">備考參考資源</div>
    <div class="ss">完整課程、同儕筆記，以及考古題與複試資源。</div>
    <div class="filter-bar">
      <div class="filter-chips" id="matFilterChips"></div>
    </div>
    <div class="res-grid" id="resGrid"></div>
    <div class="filter-empty" id="matEmpty">找不到符合的素材，換個關鍵字試試。</div>
  </div>

  <!-- ══════════ 各校考試資訊 ══════════ -->
  <div class="sec" id="sec-schools" aria-hidden="true">
    <div class="sh">各校招生資訊</div>
    <div class="ss">更新於2026/9/2：考試入學列115學年度歷史資料，116學年度請以官方簡章為準。</div>
    <div class="uni-grid" id="uniGrid"></div>
  </div>

</main>

<div class="task-toast" id="taskToast" role="status" aria-live="polite"></div>
<div class="global-search-panel" id="globalSearchPanel" aria-hidden="true" onclick="if(event.target===this)closeGlobalSearch()">
  <div class="global-search-dialog" role="dialog" aria-modal="true" aria-label="搜尋章節與資源">
    <div class="global-search-input-row">
      <svg class="gs-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="globalSearchInput" type="search" aria-label="搜尋章節與影片" placeholder="搜尋章節、考點或影片…" autocomplete="off">
      <button class="gs-btn voice-input-btn" type="button" onclick="startVoiceInput('globalSearchInput',this)" aria-label="語音輸入" title="語音輸入"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="17" x2="12" y2="22"/></svg></button>
    </div>
    <div class="sr-only" id="globalSearchAnnouncement" role="status" aria-live="polite"></div>
    <div class="global-search-results" id="globalSearchResults"></div>
  </div>
</div>


<script src="motion.js?v=1"></script>
<script src="data.js?v=20261008m"></script>
<script src="video-order.js?v=20261008m"></script>
<script src="chapter-core.js?v=20261008p"></script>
<script src="app.js?v=20261008r"></script>
</body>
</html>
