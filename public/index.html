<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資工所備考中心 · 116學年度</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=20261007e">
<link rel="stylesheet" href="styles.css?v=20261008q">
</head>
<body id="appRoot">

<a class="skip-link" href="#main">跳到主要內容</a>

<main id="main" tabindex="-1">
  <!-- 右上角懸浮的直排按鈕組：日曆、六科、搜尋（沒有頁首） -->
  <nav class="fab-nav" id="pillnav" aria-label="主要功能">
    <button class="pill fab-btn on" type="button" data-sec="schedule" aria-current="page" onclick="goSec('schedule',this)" aria-label="日曆" title="日曆"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></button>
    <button class="pill fab-btn" type="button" data-sec="subjects" onclick="goSec('subjects',this)" aria-label="六科" title="六科"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></button>
    <button class="pill fab-btn" type="button" data-sec="ai" onclick="goSec('ai',this)" aria-label="AI 助教" title="AI 助教"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="pill-unread" id="aiUnreadDot" style="display:none;"></span></button>
    <button class="fab-btn global-search-toggle" type="button" onclick="openGlobalSearch()" aria-label="搜尋章節與資源" title="搜尋（Ctrl+K）"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
  </nav>

  <!-- ══════════ 日曆 ══════════ -->
  <div class="sec on" id="sec-schedule" aria-hidden="false">
    <div class="checkin-banner" id="checkinBanner" style="display:none;"></div>
    <section class="restart-card" id="restartCard" aria-label="重啟模式" hidden></section>

    <div class="sh">備考日曆</div>
    <div class="cal-header-card">
      <div class="cal-greet" id="greetingLine"></div>
      <div class="daily-focus" id="dailyFocus"></div>
      <div id="calPaceWarning"></div>
      <div class="cal-next-info" id="calNextInfo"></div>
    </div>

    <div class="smart-overview" id="smartOverview"></div>
    <button class="ai-daily-brief-btn ui-btn ui-btn-primary" id="aiDailyBriefBtn" type="button" onclick="requestDailyBrief()" style="display:none;">AI 每日建議 →</button>

    <div id="calContainer"></div>
  </div>

  <!-- ══════════ 六科章節計畫 ══════════ -->
  <div class="sec" id="sec-subjects" aria-hidden="true">
    <div class="sh">六科章節詳細計畫</div>
    <div class="ss">依章節查看考點、任務與完成進度。</div>
    <div class="stabs" id="stabs" role="tablist" aria-label="六科切換"></div>
    <div id="spPanels"></div>
  </div>

  <!-- ══════════ 備考素材 ══════════ -->
  <div class="sec" id="sec-materials" aria-hidden="true">
    <div class="sh">備考參考資源</div>
    <div class="ss">完整課程、同儕筆記，以及考古題與複試資源。</div>
    <div class="filter-bar">
      <div class="filter-chips" id="matFilterChips"></div>
    </div>
    <div class="res-grid" id="resGrid"></div>
    <div class="filter-empty" id="matEmpty">找不到符合的素材，換個關鍵字試試。</div>
  </div>

  <!-- ══════════ 各校考試資訊 ══════════ -->
  <div class="sec" id="sec-schools" aria-hidden="true">
    <div class="sh">各校招生資訊</div>
    <div class="ss">更新於2026/9/2：考試入學列115學年度歷史資料，116學年度請以官方簡章為準。</div>
    <div class="uni-grid" id="uniGrid"></div>
  </div>

  <!-- ══════════ AI 助教 ══════════ -->
  <div class="sec" id="sec-ai" aria-hidden="true">
    <div class="sh">AI 助教</div>
    <div class="ss">查詢進度、調整計畫或釐清考點。</div>
    <div class="chat-wrap">
      <button class="ai-home-nudge" id="aiHomeNudge" type="button" onclick="useAiProactivePrompt()"></button>
      <div class="ai-energy-check" id="aiHomeEnergy" aria-label="今天的精神狀態"></div>
      <div class="ai-time-plans" id="aiHomeTimePlans" aria-label="依可用時間產生計畫"></div>
      <div class="chat-log" id="chatLog" role="log" aria-live="polite" aria-relevant="additions"></div>
      <div class="ai-followups" id="aiFollowups" aria-label="AI 建議的後續操作"></div>
      <div class="chat-status" id="chatStatus" role="status" aria-live="polite"></div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" class="chat-input" aria-label="輸入給 AI 助教的問題" placeholder="問AI問題，或說『這週進度落後了』…" />
        <button class="voice-input-btn ui-btn ui-btn-icon" type="button" onclick="startVoiceInput('chatInput',this)" aria-label="語音輸入"></button>
        <button onclick="sendChat()" class="chat-send-btn ui-btn ui-btn-primary" id="chatSendBtn">送出</button>
      </div>
      <div style="font-size:10px;color:var(--mt);margin-top:8px;">
        <button class="chat-reset-link" type="button" onclick="resetChat()">開始新對話</button>
        <span style="margin:0 6px;">・</span>
        <span>「開始新對話」只清對話紀錄，AI 記得的長期事實不會跟著消失（見下方）</span>
      </div>
      <div class="ai-support-grid">
        <div class="memory-panel">
          <div class="memory-hd">AI 記得的事</div>
          <div class="memory-list" id="memoryList"></div>
        </div>
        <div class="backup-panel">
          <div><div class="backup-title">進度備份</div><div class="backup-note">開始日期、完成任務、每日清單與 AI 記憶。</div></div>
          <div class="backup-actions">
            <button class="qa-btn ui-btn" onclick="exportProgressBackup()">匯出</button>
            <button class="qa-btn ui-btn" onclick="document.getElementById('backupFile').click()">匯入</button>
            <input id="backupFile" type="file" accept="application/json,.json" hidden onchange="importProgressBackup(this.files[0]);this.value=''">
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<div class="task-toast" id="taskToast" role="status" aria-live="polite"></div>
<div class="chapter-tool-modal diagnostic-modal" id="dailyBriefModal" aria-hidden="true" onclick="if(event.target===this)closeDailyBriefModal()">
  <div class="chapter-tool-dialog diagnostic-dialog" role="dialog" aria-modal="true" aria-labelledby="dailyBriefTitle">
    <button class="chapter-tool-close ui-btn ui-btn-icon" type="button" onclick="closeDailyBriefModal()" aria-label="關閉">×</button>
    <div class="chapter-tool-kicker">AI 每日建議</div>
    <h2 id="dailyBriefTitle">整理中</h2>
    <div id="dailyBriefBody" class="diagnostic-body"><div class="diagnostic-loading"><span></span><p>正在根據你的實際進度整理今天建議…</p></div></div>
  </div>
</div>
<div class="global-search-panel" id="globalSearchPanel" aria-hidden="true" onclick="if(event.target===this)closeGlobalSearch()">
  <div class="global-search-dialog" role="dialog" aria-modal="true" aria-label="搜尋章節與資源">
    <div class="global-search-input-row"><span class="search-icon" aria-hidden="true">⌕</span><input id="globalSearchInput" type="search" aria-label="搜尋章節、學校與素材" placeholder="搜尋 AVL、Page Fault、Jordan Form…" autocomplete="off"><button class="voice-input-btn ui-btn ui-btn-icon" type="button" onclick="startVoiceInput('globalSearchInput',this)" aria-label="語音輸入"></button><button class="ui-btn ui-btn-icon" type="button" onclick="closeGlobalSearch()" aria-label="關閉搜尋">×</button></div>
    <div class="sr-only" id="globalSearchAnnouncement" role="status" aria-live="polite"></div>
    <div class="global-search-results" id="globalSearchResults"></div>
  </div>
</div>

<div class="ai-context-dock" id="aiContextDock">
  <div class="ai-context-panel" id="aiContextPanel" role="dialog" aria-label="情境 AI 助教" aria-hidden="true">
    <div class="ai-context-eyebrow">目前頁面</div>
    <div class="ai-context-title" id="aiContextTitle">日曆與今日進度</div>
    <button class="ai-context-nudge" id="aiContextNudge" type="button" onclick="useAiProactivePrompt()"></button>
    <div class="ai-energy-check compact" id="aiContextEnergy" aria-label="今天的精神狀態"></div>
    <div class="ai-time-plans compact" id="aiContextTimePlans" aria-label="依可用時間產生計畫"></div>
    <div class="ai-context-actions" id="aiContextActions"></div>
    <button class="ai-context-full" type="button" onclick="openAiWithPrompt('')">開啟完整 AI 助教</button>
  </div>
  <button class="ai-context-peek" id="aiContextPeek" type="button" onclick="toggleAiContextDock()" aria-label="查看 AI 主動建議" aria-live="polite"></button>
  <button class="ai-context-trigger" type="button" onclick="toggleAiContextDock()" aria-label="開啟情境 AI 助教" aria-controls="aiContextPanel" aria-expanded="false">
    <svg class="ic ai-assistant-icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5c.7 4.8 3.2 7.3 8 8-4.8.7-7.3 3.2-8 8-.7-4.8-3.2-7.3-8-8 4.8-.7 7.3-3.2 8-8z"/><path d="M19 3v4M17 5h4M5.5 17.5v3M4 19h3"/></svg>
  </button>
</div>

<script src="data.js?v=20261008m"></script>
<script src="video-order.js?v=20261008m"></script>
<script src="chapter-core.js?v=20261008p"></script>
<script src="app.js?v=20261008r"></script>
</body>
</html>
