<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>章節學習空間</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="theme.css?v=20261007e">
<link rel="stylesheet" href="study.css?v=20261020c">
</head>
<body class="st-booting">
<script>setTimeout(function(){ document.body.classList.remove('st-booting'); }, 4000);</script>
<header class="st-top">
  <a class="st-back" href="/" id="backLink" aria-label="回六科">←<span class="pl-long"> 六科</span></a>
  <div class="st-title">
    <div class="st-kicker" id="kicker"></div>
    <h1 id="chTitle"></h1>
  </div>
  <div class="st-chprog" id="chProg"></div>
  <nav class="st-chnav">
    <a id="prevCh" class="st-chbtn" aria-label="上一章"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></a>
    <a id="nextCh" class="st-chbtn" aria-label="下一章"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></a>
  </nav>
</header>

<main class="st-main">
  <!-- 影片 ＋ 概念舞台（同樣大小） -->
  <section class="st-duo" id="duo">
    <div class="st-player-wrap is-loading"><div id="player"></div><div class="st-sub" id="subLine" aria-live="off" hidden></div><button class="st-skip" id="skipBtn" type="button" hidden></button></div>
    <div class="st-side is-loading" id="side">
      <iframe class="st-stage" id="stage" title="概念視覺化" hidden></iframe>
      <div class="st-notes" id="notesSide" hidden>
        <div class="st-notes-hd"><b>重點筆記</b><span class="st-card-sub" id="notesCount"></span></div>
        <div class="st-notes-body" id="notesList"></div>
      </div>
    </div>
  </section>

  <!-- 保母式講解：動畫現在這一步在做什麼，從最基本講起；名詞附小卡 -->
  <section class="st-teach" id="teach" hidden aria-live="polite">
    <div class="st-teach-hd"><b>講解</b><span class="st-teach-step" id="teachStep"></span></div>
    <p class="st-teach-body" id="teachBody"></p>
    <div class="st-terms" id="teachTerms"></div>
    <!-- 動畫講解模式：自己按下一步；每一步＝老師的一句話 -->
    <div class="st-walk" id="walkBar" hidden>
      <div class="st-walk-quote" id="walkQuote"></div>
      <div class="st-walk-btns">
        <button class="st-btn" id="walkPrev" type="button">‹ 上一步</button>
        <button class="st-btn" id="walkHear" type="button"></button>
        <button class="st-btn st-walk-next" id="walkNext" type="button">下一步 ›</button>
      </div>
    </div>
  </section>

  <!-- 現在在講什麼：一行就好 -->
  <section class="st-now">
    <div class="st-now-concept">
      <div class="st-now-sec" id="nowSec"></div>
      <div class="st-syncnote" id="syncNote"></div>
    </div>
    <div class="st-now-actions">
      <label class="st-follow"><input type="checkbox" id="followChk" checked> 跟著影片</label>
      <button class="st-btn" id="prevVid" aria-label="上一支影片"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button>
      <button class="st-btn st-walk-toggle" id="walkBtn" type="button" hidden>動畫講解</button>
      <button class="st-btn st-btn-sub" id="subBtn" aria-pressed="true" title="影片字幕（逐字稿）" hidden>字幕</button>
      <button class="st-btn st-btn-watch" id="watchBtn"></button>
      <button class="st-btn" id="nextVid" aria-label="下一支影片"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></button>
    </div>
  </section>

  <!-- 這支影片的段落時間軸 -->
  <nav class="st-timeline" id="timeline" aria-label="影片段落"></nav>

  <section class="st-more">
    <div class="st-tabs" role="tablist">
      <button role="tab" data-tab="videos" aria-selected="true">本章影片</button>
      <button role="tab" data-tab="full" id="fullTab" hidden>重點全文</button>
      <button role="tab" data-tab="lab" id="labTab" hidden>實驗室</button>
      <button role="tab" data-tab="quiz">小測驗</button>
      <button role="tab" data-tab="goals">目標</button>
    </div>

    <div class="st-panel" id="panel-videos">
      <div class="st-now-video"><span id="nowSeries"></span>　<b id="nowTitle"></b></div>
      <div class="st-series-hd"><span class="st-card-sub" id="seriesHint"></span></div>
      <div class="st-series" id="seriesChips"></div>
      <ol class="st-vlist" id="vlist"></ol>
    </div>
    <div class="st-panel" id="panel-full" hidden><div class="st-notes-body st-notes-full" id="notesFull"></div></div>
    <div class="st-panel" id="panel-lab" hidden></div>
    <div class="st-panel" id="panel-quiz" hidden></div>
    <div class="st-panel st-goals-panel" id="panel-goals" hidden>
      <div class="st-card">
        <div class="st-card-hd">這章要學會</div>
        <ul class="st-goals" id="goals"></ul>
      </div>
      <div id="tasks" hidden></div>
      <div class="st-card st-peer" id="peerCard" hidden>
        <div class="st-card-hd">常見地雷</div>
        <p id="peerNote"></p>
      </div>
    </div>
  </section>
</main>

<script src="sync.js?v=2"></script>
<script src="motion.js?v=1"></script>
<script src="data.js?v=20261020a"></script>
<script src="video-order.js?v=20261008m"></script>
<script src="chapter-core.js?v=20261008p"></script>
<script src="study.js?v=20261020b"></script>
</body>
</html>
