<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登入｜資工所備考中心</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/theme.css">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box; background: var(--bg); color: var(--tx); font-family: var(--font); }
  form { width: min(360px, 100%); background: var(--surf); border: 1px solid var(--bd); border-radius: 20px; padding: 24px 16px; box-sizing: border-box; display: grid; gap: 16px; animation: m-in .22s cubic-bezier(.2,.8,.2,1) both; }
  h1 { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.3; }
  p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--mt2); }
  input { font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--bd2); border-radius: 10px; background: var(--surf); color: var(--tx); outline: none; transition: border-color .16s ease; }
  input:focus { border-color: var(--ac); }
  button { font: inherit; font-size: 14px; font-weight: 700; padding: 10px 12px; border: 0; border-radius: 10px; background: var(--ac); color: var(--on-ac); cursor: pointer; transition: filter .16s ease; }
  button:hover { filter: brightness(1.06); }
  button:active { scale: .97; }
  button:disabled { opacity: .6; cursor: default; }
  .err { color: var(--red); font-size: 13px; min-height: 1.6em; margin-top: -8px; }
</style>
</head>
<body>
<form id="f">
  <h1>資工所備考中心</h1>
  <p>輸入密碼後，這台裝置會記住登入半年。</p>
  <input id="pw" type="password" autocomplete="current-password" aria-label="密碼" placeholder="密碼" required autofocus>
  <button id="go" type="submit">登入</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
  document.getElementById('f').onsubmit = async function (e) {
    e.preventDefault();
    const go = document.getElementById('go'), err = document.getElementById('err');
    go.disabled = true; err.textContent = '';
    try {
      const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
      if (r.ok) {
        const next = new URLSearchParams(location.search).get('next') || '/';
        location.replace(next.startsWith('/') && !next.startsWith('//') ? next : '/');
        return;
      }
      err.textContent = (await r.json().catch(() => ({}))).error || '登入失敗';
    } catch (e2) { err.textContent = '連不到伺服器'; }
    go.disabled = false;
  };
</script>
</body>
</html>
