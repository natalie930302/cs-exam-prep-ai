<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>複習</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="theme.css?v=20261119b">
<link rel="stylesheet" href="study.css?v=20261119c">
<style>
  /* 複習: 今日複習 (cards due + quiz answers still wrong), 速記卡 (each
     chapter's 重點整理 on one page) and one chapter's 自我檢查 round */
  body { background: var(--bg); }
  .rv { max-width: 860px; margin: 0 auto; padding: 16px; opacity: 0; transition: opacity .22s ease; }
  .rv.ready { opacity: 1; }
  @media (min-width: 640px) { .rv { padding: 24px 32px; } }
  .rv-top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .rv-top a { color: var(--mt2); text-decoration: none; font-size: 14px; }
  @media (hover: hover) { .rv-top a:hover { color: var(--tx); } }
  .rv-top h1 { font-size: 24px; line-height: 1.3; font-weight: 900; margin: 0; }
  .rv-modes, .rv-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .rv-modes a { font-size: 14px; font-weight: 700; padding: 4px 16px; border-radius: 10px; color: var(--mt2); text-decoration: none; background: var(--surf2); transition: background .16s; }
  .rv-modes a.on { background: var(--surf); color: var(--tx); box-shadow: 0 1px 3px rgba(46, 36, 24, .12); }
  .rv-tabs a { font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--bd); color: var(--tx); text-decoration: none; background: var(--surf); transition: border-color .16s; }
  @media (hover: hover) { .rv-tabs a:hover { border-color: color-mix(in srgb, var(--subj) 45%, var(--bd)); } }
  .rv-tabs a.on { background: var(--subj); border-color: var(--subj); color: #fff; }
  .rv-ch { background: var(--surf); border: 1px solid var(--bd); border-radius: 20px; padding: 16px; margin-bottom: 16px; animation: m-in .22s ease both; }
  .rv-ch-hd { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; margin: 0 0 8px; }
  .rv-ch h2 { font-size: 18px; line-height: 1.3; margin: 0; flex: 1; min-width: 200px; }
  .rv-ch h2 a { color: inherit; text-decoration: none; }
  @media (hover: hover) { .rv-ch h2 a:hover { text-decoration: underline; } }
  .rv-ch .st-handout { font-size: 15px; }
  .rv-ch .st-handout h3 { border-top: 0; padding-top: 0; margin-top: 12px; }
  .rv-btn { font: inherit; font-size: 13px; color: var(--tx); background: var(--surf); border: 1px solid var(--bd); border-radius: 10px; padding: 4px 12px; cursor: pointer; text-decoration: none; transition: border-color .16s; display: inline-block; }
  .rv-btn.main { background: var(--subj); border-color: var(--subj); color: #fff; font-weight: 700; padding: 8px 16px; font-size: 14px; }
  @media (hover: hover) { .rv-btn:hover { border-color: color-mix(in srgb, var(--subj) 45%, var(--bd)); } .rv-btn.main:hover { filter: brightness(1.06); } }
  .rv-btn:active { transform: scale(.97); }
  .rv-empty { color: var(--mt2); font-size: 14px; line-height: 1.6; }
  .rv-due { background: var(--surf); border: 1px solid var(--bd); border-radius: 20px; padding: 16px; display: grid; gap: 12px; margin-bottom: 16px; animation: m-in .22s ease both; }
  .rv-due-big { font-size: 18px; font-weight: 700; line-height: 1.3; }
  .rv-due-sub { font-size: 13px; color: var(--mt2); line-height: 1.6; }
  .rv-due-btns { display: flex; flex-wrap: wrap; gap: 8px; }
  .rv-subjs { display: flex; flex-wrap: wrap; gap: 8px; }
  .rv-subjs span { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; color: #fff; }
  .rv-sec-hd { font-size: 14px; font-weight: 700; margin: 24px 0 8px; color: var(--mt2); }
  .rv-list { display: grid; gap: 8px; }
  .rv-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; background: var(--surf); border: 1px solid var(--bd); border-radius: 14px; padding: 12px 16px; font-size: 14px; line-height: 1.6; }
  .rv-row b { flex: 1; min-width: 180px; font-weight: 700; }
  .rv-row small { color: var(--mt2); font-size: 12px; }
  .rv-how { font-size: 13px; color: var(--mt2); line-height: 1.6; margin: 24px 0 0; }
  @media print { .rv-top a, .rv-modes, .rv-tabs, .rv-btn { display: none; } .rv-ch { break-inside: avoid; border: 0; padding: 0; } }
</style>
</head>
<body>
<main class="rv" id="rv">
  <div class="rv-top"><a id="back" href="/calendar">← 日曆</a><h1 id="title">複習</h1></div>
  <nav class="rv-modes" id="modes"></nav>
  <nav class="rv-tabs" id="tabs" hidden></nav>
  <div id="list"></div>
</main>
<script src="sync.js?v=4"></script>
<script src="motion.js?v=1"></script>
<script src="data.js?v=20261020a"></script>
<script src="video-order.js?v=20261008m"></script>
<script src="chapter-core.js?v=20261118a"></script>
<script src="md.js?v=20261118b"></script>
<script src="recall.js?v=20261119a"></script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function(){});
(async function(){
  const params = new URLSearchParams(location.search);
  const $ = function(id){ return document.getElementById(id); };
  const list = $('list');
  const have = await loadHandoutIndex();
  // ?ch=ds-3 → that chapter's cards; ?s=ds → 速記卡 of a subject; otherwise 今日複習
  const chParam = params.get('ch'), sParam = params.get('s');
  const mode = chParam && have[chParam] ? 'chapter' : sParam ? 'sheet' : 'due';
  const subjOf = function(id){ return SUBJECTS.find(function(s){ return s.id === id; }); };
  const subject = subjOf((chParam || '').split('-')[0]) || subjOf(sParam) || SUBJECTS[0];
  document.documentElement.style.setProperty('--subj', mode === 'due' ? 'var(--ac)' : subject.color);
  $('modes').innerHTML = '<a href="/review.html"' + (mode === 'due' ? ' class="on"' : '') + '>今日複習</a>'
    + '<a href="/review.html?s=' + subject.id + '"' + (mode === 'sheet' ? ' class="on"' : '') + '>速記卡</a>'
    + (mode === 'chapter' ? '<a class="on" href="' + location.pathname + location.search + '">這章自我檢查</a>' : '');
  function chUrl(ch){ const p = ch.split('-'); return videoRoomUrl(p[0], Number(p[1]) - 1) + '?t=handout'; }
  function ready(){ $('rv').classList.add('ready'); }
  function cardCount(ch){ return (have[ch] || {}).cards || 0; }

  // ── one chapter's 自我檢查 ──
  if (mode === 'chapter') {
    const n = Number(chParam.split('-')[1]), c = subject.chapters[n - 1];
    document.title = subject.name + ' 第' + n + '章 自我檢查';
    $('title').textContent = subject.name + ' 第' + n + '章 自我檢查';
    $('back').href = chUrl(chParam); $('back').textContent = '← 講義';
    const cards = await loadCards(chParam);
    if (!cards.length) { list.innerHTML = '<p class="rv-empty">這章還沒有自我檢查題。</p>'; ready(); return; }
    list.innerHTML = '<p class="rv-empty">' + mdEsc(c ? c.t : '') + '・' + cards.length + ' 題。先自己回答（寫下來或說出來），再看答案，照實按記得／模糊／忘了。</p><div id="sess"></div>';
    recallSession($('sess'), cards, {endButtons: '<a href="' + chUrl(chParam) + '">回講義</a><a href="/review.html">今日複習</a>'});
    ready();
    return;
  }

  // ── 速記卡: every chapter's "## 重點整理" ──
  if (mode === 'sheet') {
    document.title = subject.name + ' 速記卡';
    $('title').textContent = subject.name + ' 速記卡';
    $('back').href = '/subjects/' + subject.id; $('back').textContent = '← 六科';
    $('tabs').hidden = false;
    $('tabs').innerHTML = SUBJECTS.map(function(s){
      return '<a href="?s=' + s.id + '"' + (s.id === subject.id ? ' class="on"' : '') + '>' + s.name + '</a>';
    }).join('');
    const parts = await Promise.all(subject.chapters.map(function(c, i){
      const ch = subject.id + '-' + (i + 1);
      if (!have[ch]) return Promise.resolve(null);
      return fetch('/handouts/' + ch + '.md').then(function(r){ return r.ok ? r.text() : ''; }).then(function(md){
        const m = md.replace(/\r/g, '').match(/^## 重點整理[^\n]*\n([\s\S]*?)(?=^## |(?![\s\S]))/m);
        return m ? m[1] : null;
      }).catch(function(){ return null; });
    }));
    list.innerHTML = subject.chapters.map(function(c, i){
      if (!parts[i]) return '';
      const ch = subject.id + '-' + (i + 1), k = cardCount(ch);
      return '<section class="rv-ch"><div class="rv-ch-hd"><h2><a href="' + chUrl(ch) + '">第' + (i + 1) + '章 ' + mdEsc(c.t) + '</a></h2>'
        + (k ? '<a class="rv-btn" href="/review.html?ch=' + ch + '">練這章 ' + k + ' 題</a>' : '') + '</div>'
        + '<div class="st-handout">' + mdToHtml(parts[i]) + '</div></section>';
    }).join('') || '<p class="rv-empty">這科還沒有講義。</p>';
    ready();
    return;
  }

  // ── 今日複習 ──
  document.title = '今日複習';
  $('title').textContent = '今日複習';
  let done = new Set();
  try { const r = await fetch('/api/tasks/done'); if (r.ok) done = new Set((await r.json()).done || []); } catch (e) {}
  const srs = srsLoad(), dueIds = srsDue(srs);
  const chs = Array.from(new Set(dueIds.map(function(id){ return id.split(':')[0]; }))).filter(function(ch){ return cardCount(ch); });
  const byCh = {};
  await Promise.all(chs.map(function(ch){ return loadCards(ch).then(function(c){ byCh[ch] = c; }); }));
  // a card whose question was rewritten has a new id: the old entry is dropped
  const known = {};
  Object.keys(byCh).forEach(function(ch){ byCh[ch].forEach(function(k){ known[k.id] = k; }); });
  let pruned = false;
  // (and so is one whose chapter no longer has cards)
  // A removal is kept as a marker with a time (not deleted), so the merge with
  // the server's and other devices' copies does not bring the card back.
  dueIds.forEach(function(id){ const ch = id.split(':')[0]; if ((byCh[ch] && byCh[ch].length && !known[id]) || !cardCount(ch)) { srs[id] = {gone: 1, ts: Date.now()}; pruned = true; } });
  if (pruned) srsSave(srs);
  const today = srsDay();
  const cards = dueIds.filter(function(id){ return known[id]; }).map(function(id){ return known[id]; })
    // most overdue first, then mixed across subjects
    .sort(function(a, b){ return (srs[a.id].d - srs[b.id].d) || (Math.random() - .5); });
  const wrong = wrongQuizDue();
  // A question reworded since it was answered (e.g. its data written into it)
  // is shown in today's wording; matched by its text, else by the same answer
  // and options. The history keeps the old text as the question's key.
  const notesBy = {};
  await Promise.all(Array.from(new Set(wrong.map(function(r){ return r.vid; }).filter(Boolean))).map(function(v){
    return fetch('/notes/' + encodeURIComponent(v) + '.json').then(function(r){ return r.ok ? r.json() : null; }).then(function(j){ notesBy[v] = j; }).catch(function(){});
  }));
  const optKey = function(o){ return o.slice().sort().join(' | '); };
  wrong.forEach(function(r){
    const qs = (notesBy[r.vid] || {}).quiz || [];
    const cur = qs.find(function(q){ return q.q === r.q; }) || qs.find(function(q){ return q.ans === r.ans && Array.isArray(q.opts) && optKey(q.opts) === optKey(r.opts); });
    if (cur && cur.opts.indexOf(cur.ans) >= 0) { r.histQ = r.q; r.q = cur.q; r.opts = cur.opts.slice(); r.ans = cur.ans; r.why = cur.why || r.why; }
  });
  // the handout section that teaches the part of the video the question came from
  let hoLinks = {};
  if (wrong.length) { try { const r = await fetch('/handouts/links.json'); if (r.ok) hoLinks = await r.json(); } catch (e) {} }
  wrong.forEach(function(r){
    const ls = hoLinks[r.subj + '-' + (r.ch + 1)] || {};
    let best = null;
    Object.keys(ls).forEach(function(title){
      const l = ls[title];
      if (l.v !== r.vid) return;
      const score = l.t <= (r.at || 0) + 5 ? l.t : -1e9 + l.t;
      if (!best || score > best.score) best = {title: title, score: score};
    });
    if (best) r.hoHref = videoRoomUrl(r.subj, r.ch) + '?t=handout&sec=' + encodeURIComponent(best.title);
  });
  const items = cards.concat(wrong.map(function(r){ return {mcq: r}; }));
  // mix subjects and kinds: interleaving helps more than one topic in a row
  for (let i = items.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = items[i]; items[i] = items[j]; items[j] = t; }
  const mins = Math.max(1, Math.round(cards.length * 0.75 + wrong.length * 0.5));
  const perSubj = {};
  items.forEach(function(x){ const s = x.mcq ? x.mcq.subj : x.ch.split('-')[0]; perSubj[s] = (perSubj[s] || 0) + 1; });
  // a quiz answer redone here goes into the same history as in the study room
  function onMcq(r, pick, ok){
    let h; try { h = JSON.parse(localStorage.getItem('qz-history') || '[]'); } catch (e) { h = []; }
    h.push({vid: r.vid, label: r.label, subj: r.subj, ch: r.ch, at: r.at, q: r.histQ || r.q, opts: r.opts, pick: pick, ans: r.ans, ok: ok, why: r.why || '', ts: Date.now()});
    try { localStorage.setItem('qz-history', JSON.stringify(h.slice(-3000))); } catch (e) {}
  }
  function start(sel){
    list.innerHTML = '<div id="sess"></div>';
    recallSession($('sess'), sel, {onMcq: onMcq, endButtons: '<a href="/review.html">回今日複習</a><a href="/calendar">回日曆</a>'});
    window.scrollTo({top: 0});
  }
  // what comes up next, for the empty state
  const ahead = {};
  Object.keys(srs).forEach(function(id){ const d = srs[id] && srs[id].d; if (d > today && d <= today + 7) ahead[d] = (ahead[d] || 0) + 1; });
  const nextDays = Object.keys(ahead).map(Number).sort(function(a, b){ return a - b; }).slice(0, 3);
  // chapters read (or started) whose cards were never answered
  const fresh = [];
  SUBJECTS.forEach(function(s){
    s.chapters.forEach(function(c, i){
      const ch = s.id + '-' + (i + 1);
      if (!cardCount(ch)) return;
      const read = done.has(handoutTaskId(s.id, i)) || Number(localStorage.getItem('ho-pos-' + ch)) > 0;
      if (!read) return;
      const prefix = ch + ':';
      const answered = Object.keys(srs).some(function(id){ return id.indexOf(prefix) === 0 && srs[id] && srs[id].d; });
      if (!answered) fresh.push({ch: ch, s: s, c: c, i: i});
    });
  });
  let html = '';
  if (items.length) {
    html += '<div class="rv-due"><div class="rv-due-big">今天要複習 ' + items.length + ' 題・約 ' + mins + ' 分鐘</div>'
      + '<div class="rv-subjs">' + SUBJECTS.filter(function(s){ return perSubj[s.id]; }).map(function(s){ return '<span style="background:' + s.color + '">' + s.name + ' ' + perSubj[s.id] + '</span>'; }).join('') + '</div>'
      + '<div class="rv-due-sub">' + (cards.length ? '講義自我檢查卡 ' + cards.length + ' 張' : '') + (cards.length && wrong.length ? '、' : '') + (wrong.length ? '影片小測驗答錯、還沒重做對的 ' + wrong.length + ' 題' : '') + '。各科混在一起出，比一科一科練更記得住。</div>'
      + '<div class="rv-due-btns">' + (items.length > 40 ? '<button class="rv-btn main" data-n="30">先練 30 題</button><button class="rv-btn" data-n="all">全部 ' + items.length + ' 題</button>' : '<button class="rv-btn main" data-n="all">開始複習</button>') + '</div></div>';
  } else {
    html += '<div class="rv-due"><div class="rv-due-big">今天沒有要複習的</div><div class="rv-due-sub">'
      + (nextDays.length ? '接下來：' + nextDays.map(function(d){ return srsDate(d) + ' ' + ahead[d] + ' 張'; }).join('、') + '。' : '讀講義時回答每節後面的自我檢查，答過的卡片會照記得的程度排進這裡。')
      + '</div></div>';
  }
  if (fresh.length) {
    html += '<div class="rv-sec-hd">讀過講義、還沒做自我檢查的章</div><div class="rv-list">' + fresh.map(function(x){
      return '<div class="rv-row"><b>' + x.s.name + '・第' + (x.i + 1) + '章 ' + mdEsc(x.c.t) + '</b><small>' + cardCount(x.ch) + ' 題</small><a class="rv-btn" href="/review.html?ch=' + x.ch + '">開始</a></div>';
    }).join('') + '</div>';
  }
  html += '<p class="rv-how">怎麼排的：卡片按「記得」，下次再出現的間隔一次比一次長（2、4、8、16、32、64 天；第一次就記得從 4 天開始）；「模糊」退一格，較快再出現；「忘了」明天再來，這一輪最後也會再問一次。影片小測驗答錯的題，隔天起出現在這裡，答對就不再出現。</p>';
  list.innerHTML = html;
  list.querySelectorAll('[data-n]').forEach(function(b){
    b.onclick = function(){ start(b.dataset.n === 'all' ? items : items.slice(0, Number(b.dataset.n))); };
  });
  ready();
})();
</script>
</body>
</html>
